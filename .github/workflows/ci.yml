name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting, tests, and vet
        run: make verify

      - name: Build with embedded Xray
        run: make build

      - name: Verify isolated policy routing
        run: sudo env "PATH=$PATH" VWAN_REQUIRE_XRAY=1 make integration
